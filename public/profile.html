<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Music</title>  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  <style>
    :root { color-scheme: dark; }

    body {
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .display-font {
      font-family: "Playfair Display", Georgia, serif;
    }

    .glass {
      background: rgba(15, 23, 42, 0.72);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .bg-glow {
      background:
        radial-gradient(circle at top left, rgba(34, 197, 94, 0.18), transparent 30%),
        radial-gradient(circle at top right, rgba(59, 130, 246, 0.16), transparent 28%),
        radial-gradient(circle at bottom center, rgba(168, 85, 247, 0.12), transparent 30%),
        linear-gradient(180deg, #020617 0%, #020617 100%);
    }

    .music-card {
      transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease, background .2s ease;
    }

    .music-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 18px 40px rgba(0, 0, 0, .32);
      border-color: rgba(34, 197, 94, 0.4);
      background: rgba(15, 23, 42, 0.82);
    }

    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

    .skeleton {
      position: relative;
      overflow: hidden;
      background: rgba(30, 41, 59, 0.8);
    }

    .skeleton::after {
      content: "";
      position: absolute;
      inset: 0;
      transform: translateX(-100%);
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.08),
        transparent
      );
      animation: shimmer 1.2s infinite;
    }

    @keyframes shimmer {
      100% { transform: translateX(100%); }
    }
  </style></head><body class="bg-glow text-white min-h-screen">
  <main class="max-w-6xl mx-auto px-4 py-6 sm:px-6 lg:px-8">
    <section class="glass border border-slate-800 rounded-[30px] shadow-2xl overflow-hidden">
      <div class="relative px-5 sm:px-8 pt-7 pb-6 border-b border-slate-800">
        <div class="absolute inset-0 pointer-events-none opacity-60"
             style="background: radial-gradient(circle at 50% 0%, rgba(34,197,94,0.18), transparent 35%);"></div>    <div class="relative flex flex-col items-center text-center">
      <div class="w-36 h-36 sm:w-44 sm:h-44 rounded-full border-4 border-emerald-400/40 shadow-[0_0_0_8px_rgba(34,197,94,0.06)] overflow-hidden bg-slate-950 flex items-center justify-center">
        <img id="avatar" alt="Profile picture" class="w-full h-full object-cover hidden" />
        <div id="avatarFallback" class="text-5xl sm:text-6xl font-black text-slate-400">M</div>
      </div>

      <h1 id="fullName" class="display-font mt-5 text-3xl sm:text-5xl font-extrabold tracking-tight">
        Loading artist...
      </h1>

      <p id="subtitle" class="mt-2 text-slate-300 max-w-2xl">
        Accepted songs will appear below in a clean, scrollable list.
      </p>

      <div class="mt-5 inline-flex items-center gap-2 rounded-full border border-emerald-500/25 bg-emerald-500/10 px-4 py-2 text-sm font-semibold text-emerald-200">
        <span>●</span>
        <span id="statusText">Loading...</span>
      </div>
    </div>
  </div>

  <div class="p-5 sm:p-7">
    <div class="flex items-center justify-between gap-3 mb-4 flex-wrap">
      <h2 class="text-xl sm:text-2xl font-bold">Songs</h2>
      <div id="songCount" class="text-sm text-slate-400">0 songs</div>
    </div>

    <div id="loadingState" class="space-y-3">
      <div class="rounded-2xl border border-slate-800 bg-slate-900/60 p-4 flex items-center gap-4">
        <div class="w-14 h-14 rounded-2xl skeleton"></div>
        <div class="flex-1 space-y-2">
          <div class="h-4 rounded skeleton w-2/3"></div>
          <div class="h-3 rounded skeleton w-1/3"></div>
        </div>
      </div>
      <div class="rounded-2xl border border-slate-800 bg-slate-900/60 p-4 flex items-center gap-4">
        <div class="w-14 h-14 rounded-2xl skeleton"></div>
        <div class="flex-1 space-y-2">
          <div class="h-4 rounded skeleton w-2/3"></div>
          <div class="h-3 rounded skeleton w-1/3"></div>
        </div>
      </div>
      <div class="rounded-2xl border border-slate-800 bg-slate-900/60 p-4 flex items-center gap-4">
        <div class="w-14 h-14 rounded-2xl skeleton"></div>
        <div class="flex-1 space-y-2">
          <div class="h-4 rounded skeleton w-2/3"></div>
          <div class="h-3 rounded skeleton w-1/3"></div>
        </div>
      </div>
    </div>

    <div id="errorState" class="hidden rounded-3xl border border-red-800 bg-red-500/10 p-5 text-red-200"></div>

    <div id="emptyState" class="hidden rounded-3xl border border-slate-800 bg-slate-900/60 p-10 text-center">
      <div class="text-5xl mb-3">🎧</div>
      <h3 class="text-2xl font-bold">No accepted songs yet</h3>
      <p class="mt-2 text-slate-400">When you have accepted music, it will show here.</p>
    </div>

    <div id="songsList" class="hidden mt-2 max-h-[65vh] overflow-y-auto scrollbar-hide pr-1 space-y-3"></div>
  </div>
</section>

  </main>  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    const supabase = createClient(
      "https://vixrjkcyrlbwxgegihcm.supabase.co",
      "sb_publishable_k4gygyuumSWF1k50bYxzlA_ns1iY3lQ"
    );

    const avatar = document.getElementById("avatar");
    const avatarFallback = document.getElementById("avatarFallback");
    const fullNameEl = document.getElementById("fullName");
    const subtitle = document.getElementById("subtitle");
    const statusText = document.getElementById("statusText");
    const songCount = document.getElementById("songCount");

    const loadingState = document.getElementById("loadingState");
    const errorState = document.getElementById("errorState");
    const emptyState = document.getElementById("emptyState");
    const songsList = document.getElementById("songsList");

    function initials(name) {
      const parts = String(name || "").trim().split(/\s+/).filter(Boolean);
      if (!parts.length) return "M";
      return parts.slice(0, 2).map(p => p[0]?.toUpperCase() || "").join("");
    }

    function escapeHtml(str) {
      return String(str ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function songCard(item, index) {
      const title = item.title || "Untitled song";
      const image = item.image_url || "";
      const musicUrl = item.music_url || "";

      return `
        <article class="music-card rounded-3xl border border-slate-800 bg-slate-900/70 p-4 sm:p-5">
          <div class="flex items-center gap-4">
            <div class="w-16 h-16 sm:w-20 sm:h-20 rounded-2xl overflow-hidden bg-slate-950 border border-slate-800 flex items-center justify-center shrink-0">
              ${
                image
                  ? `<img src="${escapeHtml(image)}" alt="${escapeHtml(title)}" class="w-full h-full object-cover" loading="lazy" />`
                  : `<div class="text-xl font-black text-slate-500">${String(index + 1).padStart(2, "0")}</div>`
              }
            </div>

            <div class="min-w-0 flex-1">
              <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-full bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-200 text-xs font-bold shrink-0">
                  ${String(index + 1)}
                </div>
                <div class="min-w-0">
                  <h3 class="font-bold text-base sm:text-lg truncate">${escapeHtml(title)}</h3>
                  <p class="text-sm text-slate-400 truncate">Accepted track</p>
                </div>
              </div>
            </div>

            ${
              musicUrl
                ? `<a href="${escapeHtml(musicUrl)}" target="_blank" rel="noopener noreferrer"
                     class="rounded-full border border-slate-700 bg-slate-950 px-4 py-2 text-sm font-semibold text-slate-200 hover:border-emerald-500/40 hover:text-white transition">
                     Open
                   </a>`
                : ""
            }
          </div>
        </article>
      `;
    }

    function render(rows) {
      const list = Array.isArray(rows) ? rows : [];
      const name = list[0]?.full_name || "Your Music";
      const profileImage = list[0]?.avatar_url || "";
      const total = list.length;

      fullNameEl.textContent = name;
      subtitle.textContent = total
        ? "Scroll through your accepted songs below."
        : "Accepted songs will appear below in a clean, scrollable list.";

      songCount.textContent = `${total} song${total === 1 ? "" : "s"}`;

      if (profileImage) {
        avatar.src = profileImage;
        avatar.classList.remove("hidden");
        avatarFallback.classList.add("hidden");
      } else {
        avatar.classList.add("hidden");
        avatarFallback.textContent = initials(name);
        avatarFallback.classList.remove("hidden");
      }

      songsList.innerHTML = list.map((item, index) => songCard(item, index)).join("");

      loadingState.classList.add("hidden");

      if (!list.length) {
        emptyState.classList.remove("hidden");
        songsList.classList.add("hidden");
      } else {
        emptyState.classList.add("hidden");
        songsList.classList.remove("hidden");
      }
    }

    async function loadMusic() {
      loadingState.classList.remove("hidden");
      errorState.classList.add("hidden");
      emptyState.classList.add("hidden");
      songsList.classList.add("hidden");

      try {
        const { data: sessionData, error: sessionError } = await supabase.auth.getSession();

        if (sessionError) {
          throw sessionError;
        }

        statusText.textContent = sessionData.session ? "Signed in" : "Not signed in";

        const { data, error } = await supabase.rpc("get_my_accepted_music_submissions");

        if (error) {
          throw error;
        }

        render(Array.isArray(data) ? data : []);
      } catch (err) {
        loadingState.classList.add("hidden");
        errorState.textContent = err?.message || "Failed to load music.";
        errorState.classList.remove("hidden");
        statusText.textContent = "Error";
      }
    }

    window.addEventListener("DOMContentLoaded", loadMusic);
  </script></body>
</html>

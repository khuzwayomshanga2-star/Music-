<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Choose Account Type</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    :root { color-scheme: dark; }
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-white flex items-center justify-center p-4">
  <div class="w-full max-w-2xl">
    <div class="rounded-[28px] border border-slate-800 bg-slate-900/70 shadow-2xl p-6 sm:p-8">
      <div class="mb-6">
        <div class="inline-flex items-center gap-2 rounded-full border border-emerald-500/20 bg-emerald-500/10 px-3 py-1 text-xs font-semibold text-emerald-200 mb-4">
          <span>●</span>
          <span>Account Setup</span>
        </div>
        <h1 class="text-3xl sm:text-4xl font-black tracking-tight">
          How would you like to join the app?
        </h1>
        <p class="mt-3 text-slate-300 leading-relaxed">
          Please choose the option that best describes your purpose for using the application.
        </p>
      </div>

      <p id="status" class="mb-5 text-sm text-slate-300">Please make a selection below.</p>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <button
          id="randomUserBtn"
          class="rounded-2xl border border-slate-700 bg-slate-950/60 px-5 py-5 text-left hover:border-emerald-500 hover:bg-slate-950 transition shadow-lg"
        >
          <div class="text-sm uppercase tracking-[0.2em] text-slate-400 mb-2">Option 1</div>
          <div class="text-xl font-bold">I am joining as a general user</div>
          <div class="mt-2 text-sm text-slate-400">
            Use the app to browse and interact without submitting music.
          </div>
        </button>

        <button
          id="artistBtn"
          class="rounded-2xl border border-slate-700 bg-slate-950/60 px-5 py-5 text-left hover:border-violet-500 hover:bg-slate-950 transition shadow-lg"
        >
          <div class="text-sm uppercase tracking-[0.2em] text-slate-400 mb-2">Option 2</div>
          <div class="text-xl font-bold">I am an artist who wants to earn from music</div>
          <div class="mt-2 text-sm text-slate-400">
            Continue to the submission process to create an artist account.
          </div>
        </button>
      </div>
    </div>
  </div>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    const supabase = createClient(
      "https://vixrjkcyrlbwxgegihcm.supabase.co",
      "sb_publishable_k4gygyuumSWF1k50bYxzlA_ns1iY3lQ"
    );

    const statusEl = document.getElementById("status");
    const randomUserBtn = document.getElementById("randomUserBtn");
    const artistBtn = document.getElementById("artistBtn");

    async function handleRandomUser() {
      try {
        randomUserBtn.disabled = true;
        artistBtn.disabled = true;
        statusEl.textContent = "Preparing your account...";

        const { error } = await supabase.rpc("fill_profile_name_from_email");
        if (error) throw error;

        window.location.href = "show_users.html";
      } catch (err) {
        statusEl.textContent = err?.message || "Something went wrong.";
        randomUserBtn.disabled = false;
        artistBtn.disabled = false;
      }
    }

    function handleArtist() {
      window.location.href = "account_submissions.html";
    }

    randomUserBtn.addEventListener("click", handleRandomUser);
    artistBtn.addEventListener("click", handleArtist);
  </script>
</body>
</html>

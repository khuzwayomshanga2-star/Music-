<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Musicians</title>  <script src="https://cdn.tailwindcss.com"></script>  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  <style>
    :root { color-scheme: dark; }

    .glass {
      background: rgba(15, 23, 42, 0.72);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .bg-glow {
      background:
        radial-gradient(circle at top left, rgba(34, 197, 94, 0.18), transparent 30%),
        radial-gradient(circle at top right, rgba(59, 130, 246, 0.18), transparent 28%),
        linear-gradient(180deg, #020617 0%, #020617 100%);
    }

    .card {
      transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 45px rgba(0, 0, 0, .35);
      border-color: rgba(34, 197, 94, 0.45);
    }

    .skeleton {
      position: relative;
      overflow: hidden;
      background: rgba(30, 41, 59, 0.8);
    }

    .skeleton::after {
      content: "";
      position: absolute;
      inset: 0;
      transform: translateX(-100%);
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.08),
        transparent
      );
      animation: shimmer 1.2s infinite;
    }

    @keyframes shimmer {
      100% { transform: translateX(100%); }
    }
  </style></head><body class="bg-glow text-white min-h-screen">
  <div class="max-w-7xl mx-auto px-4 py-6 sm:px-6 lg:px-8">
    <div class="glass border border-slate-800 rounded-[28px] shadow-2xl overflow-hidden">
      <div class="p-5 sm:p-7 border-b border-slate-800">
        <div class="flex flex-col gap-5">
          <div class="flex items-start justify-between gap-4 flex-wrap">
            <div>
              <div class="inline-flex items-center gap-2 rounded-full border border-emerald-500/25 bg-emerald-500/10 px-3 py-1 text-xs font-semibold text-emerald-200 mb-4">
                <span>🎵</span>
                <span>Musicians</span>
              </div>
              <h1 class="text-3xl sm:text-4xl font-black tracking-tight">Discover artists</h1>
              <p class="mt-2 text-slate-300 max-w-2xl">
                A music-style directory that presents artists in a clean, streaming-inspired layout.
              </p>
            </div>        <div class="w-full sm:w-auto min-w-[260px]">
          <label class="block text-sm text-slate-400 mb-2">Search</label>
          <input
            id="searchInput"
            type="text"
            placeholder="Search names..."
            class="w-full rounded-2xl bg-slate-950 border border-slate-700 px-4 py-3 outline-none focus:border-emerald-500 transition"
          />
        </div>
      </div>

      <div class="flex items-center justify-between gap-3 flex-wrap">
        <div class="rounded-2xl border border-slate-800 bg-slate-900/60 px-4 py-3">
          <div class="text-xs uppercase tracking-[0.2em] text-slate-400">Session</div>
          <div id="sessionStatus" class="mt-1 font-semibold text-white">Checking sign-in...</div>
        </div>
      </div>
    </div>
  </div>

  <div class="p-5 sm:p-7">
    <div id="loadingState" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4">
      <div class="animate-pulse rounded-3xl border border-slate-800 bg-slate-900/60 p-4">
        <div class="aspect-square rounded-2xl skeleton"></div>
        <div class="mt-4 h-4 rounded skeleton"></div>
        <div class="mt-2 h-3 w-2/3 rounded skeleton"></div>
      </div>
      <div class="animate-pulse rounded-3xl border border-slate-800 bg-slate-900/60 p-4">
        <div class="aspect-square rounded-2xl skeleton"></div>
        <div class="mt-4 h-4 rounded skeleton"></div>
        <div class="mt-2 h-3 w-2/3 rounded skeleton"></div>
      </div>
      <div class="animate-pulse rounded-3xl border border-slate-800 bg-slate-900/60 p-4">
        <div class="aspect-square rounded-2xl skeleton"></div>
        <div class="mt-4 h-4 rounded skeleton"></div>
        <div class="mt-2 h-3 w-2/3 rounded skeleton"></div>
      </div>
      <div class="animate-pulse rounded-3xl border border-slate-800 bg-slate-900/60 p-4">
        <div class="aspect-square rounded-2xl skeleton"></div>
        <div class="mt-4 h-4 rounded skeleton"></div>
        <div class="mt-2 h-3 w-2/3 rounded skeleton"></div>
      </div>
    </div>

    <div id="errorState" class="hidden rounded-3xl border border-red-800 bg-red-500/10 p-5 text-red-200"></div>

    <div id="grid" class="hidden grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4"></div>

    <div id="emptyState" class="hidden rounded-3xl border border-slate-800 bg-slate-900/60 p-10 text-center">
      <div class="text-5xl mb-3">🎧</div>
      <h2 class="text-2xl font-bold">No musicians found</h2>
      <p class="mt-2 text-slate-400">Try another search term.</p>
    </div>
  </div>
</div>

  </div>  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    const supabase = createClient(
      "https://vixrjkcyrlbwxgegihcm.supabase.co",
      "sb_publishable_k4gygyuumSWF1k50bYxzlA_ns1iY3lQ"
    );

    const sessionStatus = document.getElementById("sessionStatus");
    const searchInput = document.getElementById("searchInput");
    const loadingState = document.getElementById("loadingState");
    const errorState = document.getElementById("errorState");
    const grid = document.getElementById("grid");
    const emptyState = document.getElementById("emptyState");

    let allProfiles = [];

    function initials(name) {
      const parts = String(name || "").trim().split(/\s+/).filter(Boolean);
      if (!parts.length) return "M";
      return parts.slice(0, 2).map(p => p[0]?.toUpperCase() || "").join("");
    }

    function escapeHtml(str) {
      return String(str ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function cardMarkup(profile) {
      const name = profile.full_name || "Unnamed artist";
      const avatar = profile.avatar_url || "";

      return `
        <div class="card rounded-3xl border border-slate-800 bg-slate-900/70 p-4">
          <div class="aspect-square rounded-2xl overflow-hidden bg-slate-950 border border-slate-800 relative flex items-center justify-center">
            ${
              avatar
                ? `<img src="${escapeHtml(avatar)}" alt="${escapeHtml(name)}" class="w-full h-full object-cover" loading="lazy" />`
                : `<div class="text-4xl font-black text-slate-400">${escapeHtml(initials(name))}</div>`
            }
          </div>

          <div class="mt-4">
            <h2 class="font-bold text-base sm:text-lg leading-tight truncate">${escapeHtml(name)}</h2>
            <div class="mt-3 inline-flex items-center gap-2 rounded-full bg-emerald-500/10 border border-emerald-500/20 px-3 py-1 text-xs text-emerald-200">
              <span>●</span>
              <span>Artist</span>
            </div>
          </div>
        </div>
      `;
    }

    function render(list) {
      const q = searchInput.value.trim().toLowerCase();
      const filtered = list.filter(p => {
        const name = String(p.full_name || "").toLowerCase();
        return name.includes(q);
      });

      grid.innerHTML = filtered.map(cardMarkup).join("");

      grid.classList.toggle("hidden", filtered.length === 0);
      emptyState.classList.toggle("hidden", filtered.length !== 0);
    }

    async function loadProfiles() {
      loadingState.classList.remove("hidden");
      errorState.classList.add("hidden");
      grid.classList.add("hidden");
      emptyState.classList.add("hidden");

      const { data: sessionData, error: sessionError } = await supabase.auth.getSession();
      if (sessionError) {
        sessionStatus.textContent = "Sign-in check failed";
      } else {
        sessionStatus.textContent = sessionData.session ? "Signed in" : "Not signed in";
      }

      const { data, error } = await supabase.rpc("get_profile_data");

      loadingState.classList.add("hidden");

      if (error) {
        errorState.textContent = error.message || "Failed to load musicians.";
        errorState.classList.remove("hidden");
        return;
      }

      allProfiles = Array.isArray(data) ? data : [];
      render(allProfiles);
    }

    searchInput.addEventListener("input", () => render(allProfiles));
    window.addEventListener("DOMContentLoaded", loadProfiles);
  </script></body>
          </html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Submission Viewer</title>

<script src="https://cdn.tailwindcss.com"></script>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
  "https://vixrjkcyrlbwxgegihcm.supabase.co",
  ""
);

const status = document.getElementById("status");
const card = document.getElementById("card");

async function loadSubmission() {

    const { data: sessionData } = await supabase.auth.getSession();

    if (!sessionData.session) {
        status.textContent = "Please sign in.";
        return;
    }

    const submissionId = new URLSearchParams(location.search).get("submissionId");

    if (!submissionId) {
        status.textContent = "No submissionId found in URL.";
        return;
    }

    status.textContent = "Loading...";

    const { data, error } = await supabase.rpc(
        "get_my_music_submission",
        {
            submission_id: submissionId
        }
    );

    if (error) {
        status.textContent = error.message;
        return;
    }

    const submission = Array.isArray(data) ? data[0] : data;

    if (!submission) {
        status.textContent = "Submission not found.";
        return;
    }

    document.getElementById("submissionId").textContent =
        submission.id || submissionId;

    document.getElementById("title").textContent =
        submission.title || "No title";

    document.getElementById("acceptance").textContent =
        submission.acceptance || "Pending";

    const image =
        submission.image_url ||
        submission.cover_image_url ||
        submission.secure_url ||
        submission.url;

    if (image) {
        document.getElementById("cover").src = image;
        document.getElementById("cover").classList.remove("hidden");
    }

    card.classList.remove("hidden");
    status.textContent = "";
}

window.addEventListener("DOMContentLoaded", loadSubmission);
</script>
</head>

<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-6">

<div class="w-full max-w-lg">

<h1 class="text-3xl font-bold mb-6">
Submission Viewer
</h1>

<p id="status" class="text-slate-300 mb-4">
Loading...
</p>

<div id="card" class="hidden bg-slate-800 rounded-xl p-5 space-y-4">

<img
id="cover"
class="hidden w-full rounded-lg border border-slate-700"
>

<div>
<p class="text-slate-400">Submission ID</p>
<p id="submissionId" class="font-bold"></p>
</div>

<div>
<p class="text-slate-400">Title</p>
<p id="title" class="font-bold"></p>
</div>

<div>
<p class="text-slate-400">Status</p>
<p id="acceptance" class="font-bold"></p>
</div>

</div>

</div>

</body>
</html>

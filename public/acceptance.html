<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Application Status</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root { color-scheme: dark; }

    .bg-glow {
      background:
        radial-gradient(circle at top left, rgba(34, 197, 94, 0.18), transparent 28%),
        radial-gradient(circle at top right, rgba(59, 130, 246, 0.16), transparent 30%),
        linear-gradient(180deg, #020617 0%, #020617 100%);
    }

    .glass {
      background: rgba(15, 23, 42, 0.72);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .pulse-ring {
      animation: pulseRing 1.8s ease-in-out infinite;
    }

    @keyframes pulseRing {
      0%, 100% { transform: scale(1); opacity: 0.55; }
      50% { transform: scale(1.08); opacity: 0.95; }
    }

    .check-pop {
      animation: checkPop 0.65s ease-out both;
    }

    @keyframes checkPop {
      0% { transform: scale(0.6); opacity: 0; }
      60% { transform: scale(1.08); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    .fade-in {
      animation: fadeIn 0.45s ease-out both;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="bg-glow text-white min-h-screen flex items-center justify-center p-6">
  <div class="w-full max-w-xl">
    <div class="glass border border-slate-800 rounded-[28px] shadow-2xl p-6 sm:p-8">
      <div class="text-center">
        <div id="iconWrap" class="mx-auto w-24 h-24 rounded-full bg-slate-900/70 border border-slate-700 flex items-center justify-center relative overflow-hidden">
          <div class="absolute inset-0 bg-emerald-500/10 pulse-ring hidden" id="ring"></div>
          <div id="icon" class="text-4xl">⏳</div>
        </div>

        <h1 id="title" class="mt-6 text-3xl sm:text-4xl font-black tracking-tight">Checking your application</h1>
        <p id="message" class="mt-3 text-slate-300 leading-relaxed">
          Please wait while we verify your submission status.
        </p>

        <div id="statusCard" class="mt-8 hidden rounded-2xl border border-slate-800 bg-slate-900/60 p-5 fade-in">
          <div class="text-xs uppercase tracking-[0.2em] text-slate-400 mb-2">Status</div>
          <div id="statusText" class="text-lg font-bold text-white">Working...</div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    const supabase = createClient(
      "https://vixrjkcyrlbwxgegihcm.supabase.co",
      "sb_publishable_k4gygyuumSWF1k50bYxzlA_ns1iY3lQ"
    );

    const icon = document.getElementById("icon");
    const ring = document.getElementById("ring");
    const titleEl = document.getElementById("title");
    const messageEl = document.getElementById("message");
    const statusCard = document.getElementById("statusCard");
    const statusText = document.getElementById("statusText");

    function setWaiting() {
      ring.classList.remove("hidden");
      icon.textContent = "⏳";
      titleEl.textContent = "Application still waiting";
      messageEl.textContent = "Your application is still under review. Please wait while it is checked.";
      statusCard.classList.remove("hidden");
      statusText.textContent = "Pending review";
    }

    function setAccepted() {
      ring.classList.add("hidden");
      icon.textContent = "✓";
      icon.className = "text-5xl text-emerald-400 check-pop";
      titleEl.textContent = "Application accepted";
      messageEl.textContent = "You have been approved. Redirecting to your profile now.";
      statusCard.classList.remove("hidden");
      statusText.textContent = "Approved";
    }

    async function checkStatus() {
      try {
        const { data: sessionData, error: sessionError } = await supabase.auth.getSession();

        if (sessionError) {
          setWaiting();
          statusText.textContent = sessionError.message;
          return;
        }

        if (!sessionData.session) {
          titleEl.textContent = "Please sign in";
          messageEl.textContent = "You need to sign in before we can check your application.";
          icon.textContent = "🔒";
          ring.classList.add("hidden");
          statusCard.classList.remove("hidden");
          statusText.textContent = "Not signed in";
          return;
        }

        setWaiting();

        const { data, error } = await supabase.rpc("get_my_application_status");
        if (error) {
          statusText.textContent = error.message;
          return;
        }

        const row = Array.isArray(data) ? data[0] : data;
        const submission = Boolean(row?.submission);
        const verification = Boolean(row?.verification);

        if (submission && verification) {
          setAccepted();
          setTimeout(() => {
            window.location.replace("my_profile.html");
          }, 1800);
          return;
        }

        setWaiting();
      } catch (err) {
        titleEl.textContent = "Something went wrong";
        messageEl.textContent = err?.message || "Could not check application status.";
        icon.textContent = "!";
        ring.classList.add("hidden");
        statusCard.classList.remove("hidden");
        statusText.textContent = "Error";
      }
    }

    window.addEventListener("DOMContentLoaded", checkStatus);
  </script>
</body>
</html>
